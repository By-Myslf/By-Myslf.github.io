name: Copy sample from champagneclub.hu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/sample.json
      - tools/fetch_wp.py
      - .github/workflows/fetch-sample.yml

permissions:
  contents: write

concurrency:
  group: fetch-sample
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Copy posts and photos
        run: python tools/fetch_wp.py data/sample.json 2>&1 | tee data/fetch-log.txt
      - name: Save results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw img data/fetch-log.txt
          git commit -m "Copy sample items and photos from champagneclub.hu" || { echo "Nothing new"; exit 0; }
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
