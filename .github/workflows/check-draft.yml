# Test-builds work in progress on any branch other than main, WITHOUT publishing it.
# The built files are saved to the "draft-preview" branch (replaced each time),
# so changes can be checked before they go live. You don't need to edit this file.

name: Check draft

on:
  push:
    branches-ignore: [main, draft-preview]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Astro
        run: npm install

      - name: Build the website
        run: npm run build
        env:
          SITE: https://by-myslf.github.io
          BASE: /

      - name: Save the built site to the draft-preview branch
        working-directory: dist
        run: |
          git init -q -b draft-preview
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Preview of $GITHUB_REF_NAME at ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" draft-preview
